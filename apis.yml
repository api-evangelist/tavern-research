aid: tavern-research
name: Tavern Research
description: Tavern Research is a political opinion research and communications firm
  that integrates polling, message testing, and original ad production for Democratic
  campaigns and advocacy organizations. It pairs rapid survey research (marketed as
  "insights in 48 hours"), AI-powered content creation, and large-scale creative experimentation
  to learn which messages move voters, then produces and optimizes ads through placement.
  Surfaced as a Bloomberg Beta portfolio company and added to the API Evangelist network;
  the firm runs a marketing website on Squarespace and publishes no public API, developer
  documentation, or SDKs at this time.
